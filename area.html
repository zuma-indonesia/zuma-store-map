<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zuma Indonesia · Peta Toko</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --zuma: #002A3A;
            --zuma-soft: #0a4558;
            --zuma-ink: #001A25;
            --accent: #C9A961;
            --bg: #FAFAF7;
            --surface: #FFFFFF;
            --border: #EAE7DF;
            --border-soft: #F0EDE5;
            --muted: #7A7668;
            --text: #1F1D18;

            --c-bali: #D65656;
            --c-jatim: #2D5E87;
            --c-jkt: #C9A961;
            --c-lombok: #7A4FA3;
            --c-batam: #0D8F7C;
            --c-pku: #D97843;
            --c-sul: #3A8F47;

            --shadow-sm: 0 1px 2px rgba(0,26,37,0.04), 0 1px 3px rgba(0,26,37,0.06);
            --shadow: 0 4px 12px rgba(0,26,37,0.06), 0 2px 4px rgba(0,26,37,0.04);
            --shadow-lg: 0 12px 32px rgba(0,26,37,0.10), 0 4px 8px rgba(0,26,37,0.04);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            font-feature-settings: "ss01", "cv11";
            -webkit-font-smoothing: antialiased;
        }

        .app {
            display: grid;
            grid-template-columns: 380px 1fr;
            height: 100vh;
        }

        /* ========== SIDEBAR ========== */
        .sidebar {
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 1000;
            overflow: hidden;
        }

        .header {
            padding: 24px 24px 16px;
            border-bottom: 1px solid var(--border-soft);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        .brand-mark {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: var(--zuma);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-sm);
            flex-shrink: 0;
        }
        .brand-mark img {
            width: 70%;
            height: 70%;
            object-fit: contain;
            filter: brightness(0) invert(1);
        }
        .brand-text h1 {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--zuma);
            line-height: 1.2;
        }
        .brand-text p {
            font-size: 11px;
            color: var(--muted);
            font-weight: 500;
            margin-top: 2px;
        }

        .mode-switch {
            display: flex;
            background: var(--bg);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid var(--border-soft);
            margin-bottom: 20px;
        }
        .mode-switch a {
            flex: 1;
            padding: 9px 12px;
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            text-decoration: none;
            border-radius: 7px;
            transition: all 0.18s ease;
            letter-spacing: -0.005em;
        }
        .mode-switch a:hover:not(.active) { color: var(--zuma); }
        .mode-switch a.active {
            background: var(--surface);
            color: var(--zuma);
            box-shadow: var(--shadow-sm);
        }

        .stats {
            display: flex;
            gap: 28px;
            padding-top: 4px;
        }
        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .stat-num {
            font-family: 'Space Mono', monospace;
            font-size: 22px;
            font-weight: 700;
            color: var(--zuma);
            letter-spacing: -0.02em;
            line-height: 1;
        }
        .stat-lbl {
            font-size: 10px;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        /* ========== SEARCH ========== */
        .search {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-soft);
        }
        .search-wrap {
            position: relative;
        }
        .search-wrap svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            color: var(--muted);
            pointer-events: none;
        }
        .search input {
            width: 100%;
            padding: 11px 14px 11px 40px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 13px;
            font-family: inherit;
            font-weight: 500;
            color: var(--text);
            background: var(--surface);
            transition: all 0.18s ease;
        }
        .search input::placeholder { color: var(--muted); font-weight: 500; }
        .search input:focus {
            outline: none;
            border-color: var(--zuma);
            box-shadow: 0 0 0 3px rgba(0,42,58,0.08);
        }

        /* ========== FILTER ========== */
        .filter {
            padding: 16px 20px 8px;
            border-bottom: 1px solid var(--border-soft);
        }
        .filter-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .filter-title {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
        }
        .filter-actions {
            display: flex;
            gap: 12px;
        }
        .filter-actions button {
            background: none;
            border: none;
            font-family: inherit;
            font-size: 11px;
            font-weight: 600;
            color: var(--zuma);
            cursor: pointer;
            padding: 0;
            transition: opacity 0.15s;
        }
        .filter-actions button:hover { opacity: 0.65; }

        .cabang-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            list-style: none;
            padding-bottom: 8px;
        }
        .cabang-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 12px 7px 10px;
            border-radius: 999px;
            background: var(--bg);
            border: 1px solid var(--border-soft);
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            color: var(--text);
            transition: all 0.15s ease;
            user-select: none;
        }
        .cabang-chip:hover {
            border-color: var(--border);
            background: var(--surface);
        }
        .cabang-chip.off {
            color: var(--muted);
            opacity: 0.55;
        }
        .cabang-chip.off .chip-dot {
            background: var(--muted) !important;
            opacity: 0.4;
        }
        .chip-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
            transition: all 0.15s;
        }
        .chip-count {
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            font-weight: 700;
            opacity: 0.6;
            margin-left: 2px;
        }

        /* ========== STORE LIST ========== */
        .store-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px 20px;
        }
        .store-list::-webkit-scrollbar { width: 6px; }
        .store-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        .store-list::-webkit-scrollbar-track { background: transparent; }

        .list-head {
            padding: 12px 8px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: var(--surface);
            z-index: 1;
        }
        .list-head-title {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
        }
        .list-head-count {
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            font-weight: 700;
            color: var(--zuma);
        }

        .group-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
            padding: 14px 8px 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .group-label .group-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .store-item {
            padding: 12px 12px;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 2px;
            border: 1px solid transparent;
            transition: all 0.15s ease;
            position: relative;
        }
        .store-item:hover {
            background: var(--bg);
        }
        .store-item.active {
            background: var(--bg);
            border-color: var(--border);
            box-shadow: var(--shadow-sm);
        }
        .store-name {
            font-size: 13.5px;
            font-weight: 600;
            color: var(--text);
            letter-spacing: -0.01em;
            margin-bottom: 3px;
            line-height: 1.3;
        }
        .store-meta {
            font-size: 11.5px;
            color: var(--muted);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .store-meta .meta-dot {
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: var(--muted);
            opacity: 0.5;
        }

        .empty {
            text-align: center;
            padding: 48px 24px;
            color: var(--muted);
        }
        .empty-icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 12px;
            opacity: 0.4;
        }
        .empty-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 4px;
        }
        .empty-msg {
            font-size: 12px;
            line-height: 1.5;
        }

        /* ========== MAP ========== */
        .main {
            position: relative;
            background: var(--bg);
        }
        #map {
            width: 100%;
            height: 100%;
            background: #E8E5DD;
        }

        /* Custom marker */
        .custom-marker {
            background: none !important;
            border: none !important;
        }
        .marker-pin {
            filter: drop-shadow(0 3px 6px rgba(0,26,37,0.25));
            transition: transform 0.15s ease;
        }
        .marker-pin:hover {
            transform: translateY(-2px);
        }

        /* ========== POPUP ========== */
        .leaflet-popup-content-wrapper {
            border-radius: 14px;
            padding: 0;
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border);
        }
        .leaflet-popup-content {
            margin: 0;
            padding: 0;
            min-width: 280px;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .leaflet-popup-tip { box-shadow: var(--shadow-sm); }

        .popup {
            background: var(--surface);
        }
        .popup-accent {
            height: 3px;
        }
        .popup-top {
            padding: 14px 16px 10px;
        }
        .popup-cabang {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
            margin-bottom: 6px;
        }
        .popup-cabang-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }
        .popup-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--zuma);
            letter-spacing: -0.015em;
            line-height: 1.25;
        }
        .popup-body {
            padding: 4px 16px 14px;
        }
        .popup-address {
            font-size: 12.5px;
            color: var(--text);
            line-height: 1.5;
            padding: 10px 12px;
            background: var(--bg);
            border-radius: 8px;
            margin-bottom: 10px;
            font-weight: 500;
        }
        .popup-address-city {
            font-size: 11px;
            color: var(--muted);
            font-weight: 600;
            margin-bottom: 4px;
        }
        .popup-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        .popup-btn {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-family: inherit;
            font-size: 11.5px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: all 0.15s ease;
            letter-spacing: -0.005em;
        }
        .popup-btn:hover {
            background: var(--bg);
            border-color: var(--zuma);
            color: var(--zuma);
        }
        .popup-btn.primary {
            background: var(--zuma);
            color: white;
            border-color: var(--zuma);
        }
        .popup-btn.primary:hover {
            background: var(--zuma-ink);
            color: white;
        }

        /* ========== TOAST ========== */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(8px);
            background: var(--zuma);
            color: white;
            padding: 11px 18px;
            border-radius: 999px;
            font-size: 12.5px;
            font-weight: 600;
            box-shadow: var(--shadow-lg);
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s ease;
            letter-spacing: -0.005em;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ========== LOADING ========== */
        .loading {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.3s;
        }
        .loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .spinner {
            width: 32px;
            height: 32px;
            border: 2.5px solid var(--border);
            border-top-color: var(--zuma);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ========== MOBILE ========== */
        .mobile-toggle {
            display: none;
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 1001;
            background: var(--surface);
            border: 1px solid var(--border);
            width: 44px;
            height: 44px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            cursor: pointer;
            align-items: center;
            justify-content: center;
            color: var(--zuma);
        }
        .mobile-toggle svg { width: 20px; height: 20px; }

        @media (max-width: 820px) {
            .app { grid-template-columns: 1fr; }
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                bottom: 0;
                width: 88%;
                max-width: 380px;
                transform: translateX(-100%);
                transition: transform 0.28s ease;
                box-shadow: var(--shadow-lg);
            }
            .sidebar.open { transform: translateX(0); }
            .mobile-toggle { display: flex; }
        }

        /* Leaflet overrides */
        .leaflet-control-zoom {
            border: 1px solid var(--border) !important;
            box-shadow: var(--shadow) !important;
            border-radius: 10px !important;
            overflow: hidden;
        }
        .leaflet-control-zoom a {
            background: var(--surface) !important;
            color: var(--zuma) !important;
            border-bottom-color: var(--border-soft) !important;
            font-weight: 600 !important;
        }
        .leaflet-control-zoom a:hover {
            background: var(--bg) !important;
        }
        .leaflet-control-attribution {
            background: rgba(255,255,255,0.85) !important;
            font-family: 'Plus Jakarta Sans', sans-serif !important;
            font-size: 10px !important;
            border-radius: 6px 0 0 0 !important;
        }
    </style>
</head>
<body>
    <button class="mobile-toggle" id="mobileToggle" aria-label="Toggle menu">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>

    <div class="app">
        <aside class="sidebar" id="sidebar">
            <div class="header">
                <div class="brand">
                    <div class="brand-mark"><img src="logo.png" alt="Zuma"></div>
                    <div class="brand-text">
                        <h1>Zuma Indonesia</h1>
                        <p>Peta Toko & Area</p>
                    </div>
                </div>

                <div class="mode-switch">
                    <a href="index.html">Perdin</a>
                    <a href="area.html" class="active">Peta Area</a>
                </div>

                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-num" id="statStores">—</div>
                        <div class="stat-lbl">Toko</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-num" id="statCabang">—</div>
                        <div class="stat-lbl">Cabang</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-num" id="statCities">—</div>
                        <div class="stat-lbl">Kota</div>
                    </div>
                </div>
            </div>

            <div class="search">
                <div class="search-wrap">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35" stroke-linecap="round"/></svg>
                    <input type="text" id="searchInput" placeholder="Cari toko, kota, atau alamat">
                </div>
            </div>

            <div class="filter">
                <div class="filter-head">
                    <div class="filter-title">Filter Cabang</div>
                    <div class="filter-actions">
                        <button id="selectAll">Pilih semua</button>
                        <button id="selectNone">Kosongkan</button>
                    </div>
                </div>
                <ul class="cabang-grid" id="cabangList"></ul>
            </div>

            <div class="store-list" id="storeList"></div>
        </aside>

        <main class="main">
            <div id="map"></div>
        </main>
    </div>

    <div class="toast" id="toast"></div>
    <div class="loading" id="loading"><div class="spinner"></div></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbyKLNytmc4XDE_MndAz_0MMxpL7sQgMVfJb5Ocoue53bqrZx_Iu8g8LMFBzHHGeL7_1/exec';

        const CABANG_COLORS = {
            'Bali': '#D65656',
            'Jawa Timur': '#2D5E87',
            'Jakarta': '#C9A961',
            'Lombok & Nusra': '#7A4FA3',
            'Batam & Kepri': '#0D8F7C',
            'Pekanbaru': '#D97843',
            'Sulawesi': '#3A8F47'
        };
        const DEFAULT_COLOR = '#7A7668';

        let stores = [];
        let markers = {};
        let activeCabang = new Set();
        let searchQuery = '';
        let map;
        let activeStoreId = null;

        document.addEventListener('DOMContentLoaded', init);

        async function init() {
            initMap();
            await loadData();
            buildCabangFilter();
            renderMarkers(true);
            renderStoreList();
            setupEvents();
            setTimeout(() => document.getElementById('loading').classList.add('hidden'), 350);
        }

        function initMap() {
            map = L.map('map', {
                center: [-2.5, 118],
                zoom: 5,
                zoomControl: false,
                attributionControl: true
            });
            L.control.zoom({ position: 'bottomright' }).addTo(map);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap © CARTO'
            }).addTo(map);
        }

        async function loadData() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                if (data.stores && data.stores.length > 0) {
                    stores = data.stores;
                }
            } catch (err) {
                console.error('Failed to load data:', err);
                toast('Gagal memuat data toko');
            }
            document.getElementById('statStores').textContent = stores.length;
            const cabangSet = new Set(stores.map(s => s.branch));
            document.getElementById('statCabang').textContent = cabangSet.size;
            const citiesSet = new Set(stores.map(s => s.city));
            document.getElementById('statCities').textContent = citiesSet.size;
        }

        function getCabangColor(cabang) {
            return CABANG_COLORS[cabang] || DEFAULT_COLOR;
        }

        function makeIcon(color, isActive = false) {
            const scale = isActive ? 1.15 : 1;
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 44" width="${32 * scale}" height="${44 * scale}" class="marker-pin">
                <defs>
                    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="0.8" />
                    </filter>
                </defs>
                <path d="M16 2C8.82 2 3 7.82 3 15c0 9.75 13 27 13 27s13-17.25 13-27C29 7.82 23.18 2 16 2z"
                      fill="${color}" stroke="white" stroke-width="2.5" />
                <circle cx="16" cy="15" r="5" fill="white"/>
                <circle cx="16" cy="15" r="2.5" fill="${color}"/>
            </svg>`;
            return L.divIcon({
                html: svg,
                className: 'custom-marker',
                iconSize: [32 * scale, 44 * scale],
                iconAnchor: [16 * scale, 44 * scale],
                popupAnchor: [0, -40 * scale]
            });
        }

        function buildCabangFilter() {
            const cabangCounts = {};
            stores.forEach(s => {
                cabangCounts[s.branch] = (cabangCounts[s.branch] || 0) + 1;
            });
            const sortedCabang = Object.keys(cabangCounts).sort((a, b) => cabangCounts[b] - cabangCounts[a]);
            sortedCabang.forEach(c => activeCabang.add(c));

            const list = document.getElementById('cabangList');
            list.innerHTML = sortedCabang.map(cabang => `
                <li class="cabang-chip" data-cabang="${cabang}">
                    <span class="chip-dot" style="background: ${getCabangColor(cabang)}"></span>
                    <span>${cabang}</span>
                    <span class="chip-count">${cabangCounts[cabang]}</span>
                </li>
            `).join('');

            list.querySelectorAll('.cabang-chip').forEach(el => {
                el.addEventListener('click', () => {
                    const cabang = el.dataset.cabang;
                    const nowActive = !activeCabang.has(cabang);
                    if (nowActive) activeCabang.add(cabang);
                    else activeCabang.delete(cabang);
                    el.classList.toggle('off', !nowActive);
                    renderMarkers();
                    renderStoreList();
                });
            });
        }

        function renderMarkers(initial = false) {
            Object.values(markers).forEach(m => map.removeLayer(m));
            markers = {};

            const visible = getVisibleStores();
            visible.forEach(store => {
                const color = getCabangColor(store.branch);
                const marker = L.marker([store.lat, store.lng], { icon: makeIcon(color) });
                marker.bindPopup(buildPopup(store), { closeButton: true, offset: [0, -4] });
                marker.on('click', () => { activeStoreId = store.id; });
                marker.addTo(map);
                markers[store.id] = marker;
            });

            if (!initial && visible.length > 0) {
                const hasFilter = searchQuery || activeCabang.size < Object.keys(CABANG_COLORS).length;
                if (hasFilter) {
                    const group = L.featureGroup(Object.values(markers));
                    const bounds = group.getBounds();
                    if (bounds.isValid()) map.fitBounds(bounds, { padding: [60, 60], maxZoom: 12 });
                }
            }
        }

        function buildPopup(store) {
            const color = getCabangColor(store.branch);
            const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${store.lat},${store.lng}`;
            const areaText = (store.area && store.area !== store.branch) ? ` · ${store.area}` : '';
            return `
                <div class="popup">
                    <div class="popup-accent" style="background: ${color}"></div>
                    <div class="popup-top">
                        <div class="popup-cabang">
                            <span class="popup-cabang-dot" style="background: ${color}"></span>
                            ${store.branch}${areaText}
                        </div>
                        <div class="popup-title">${store.name}</div>
                    </div>
                    <div class="popup-body">
                        <div class="popup-address">
                            <div class="popup-address-city">${store.city}</div>
                            ${store.address}
                        </div>
                        <div class="popup-actions">
                            <button class="popup-btn" onclick="copyAddress(${store.id})">Copy Alamat</button>
                            <a href="${mapsUrl}" target="_blank" rel="noopener" class="popup-btn primary">Buka Maps</a>
                        </div>
                    </div>
                </div>
            `;
        }

        function getVisibleStores() {
            const q = searchQuery.toLowerCase().trim();
            return stores.filter(s => {
                if (!activeCabang.has(s.branch)) return false;
                if (!q) return true;
                return s.name.toLowerCase().includes(q) ||
                       s.city.toLowerCase().includes(q) ||
                       s.address.toLowerCase().includes(q) ||
                       (s.area || '').toLowerCase().includes(q);
            });
        }

        function renderStoreList() {
            const visible = getVisibleStores();
            const list = document.getElementById('storeList');
            const headHtml = `
                <div class="list-head">
                    <div class="list-head-title">Daftar Toko</div>
                    <div class="list-head-count">${visible.length}</div>
                </div>
            `;

            if (visible.length === 0) {
                list.innerHTML = headHtml + `
                    <div class="empty">
                        <svg class="empty-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35" stroke-linecap="round"/></svg>
                        <div class="empty-title">Tidak ada toko</div>
                        <div class="empty-msg">Coba ubah filter atau kata kunci pencarian.</div>
                    </div>
                `;
                return;
            }

            const grouped = {};
            visible.forEach(s => {
                if (!grouped[s.branch]) grouped[s.branch] = [];
                grouped[s.branch].push(s);
            });

            const cabangOrder = Object.keys(grouped).sort((a, b) => grouped[b].length - grouped[a].length);

            const sections = cabangOrder.map(cabang => {
                const color = getCabangColor(cabang);
                const items = grouped[cabang].map(s => `
                    <div class="store-item ${activeStoreId === s.id ? 'active' : ''}" data-id="${s.id}">
                        <div class="store-name">${s.name}</div>
                        <div class="store-meta">
                            <span>${s.city}</span>
                            ${s.area && s.area !== cabang ? `<span class="meta-dot"></span><span>${s.area}</span>` : ''}
                        </div>
                    </div>
                `).join('');
                return `
                    <div class="group-label">
                        <span class="group-dot" style="background: ${color}"></span>
                        ${cabang} <span style="opacity: 0.5; font-weight: 600;">(${grouped[cabang].length})</span>
                    </div>
                    ${items}
                `;
            }).join('');

            list.innerHTML = headHtml + sections;

            list.querySelectorAll('.store-item').forEach(el => {
                el.addEventListener('click', () => {
                    const id = parseInt(el.dataset.id);
                    const store = stores.find(s => s.id === id);
                    if (store && markers[id]) {
                        activeStoreId = id;
                        list.querySelectorAll('.store-item').forEach(e => e.classList.remove('active'));
                        el.classList.add('active');
                        map.flyTo([store.lat, store.lng], 15, { duration: 0.7 });
                        setTimeout(() => markers[id].openPopup(), 750);
                        if (window.innerWidth <= 820) {
                            document.getElementById('sidebar').classList.remove('open');
                        }
                    }
                });
            });
        }

        function setupEvents() {
            document.getElementById('searchInput').addEventListener('input', (e) => {
                searchQuery = e.target.value;
                renderMarkers();
                renderStoreList();
            });

            document.getElementById('selectAll').addEventListener('click', () => {
                stores.forEach(s => activeCabang.add(s.branch));
                document.querySelectorAll('.cabang-chip').forEach(el => el.classList.remove('off'));
                renderMarkers();
                renderStoreList();
            });

            document.getElementById('selectNone').addEventListener('click', () => {
                activeCabang.clear();
                document.querySelectorAll('.cabang-chip').forEach(el => el.classList.add('off'));
                renderMarkers();
                renderStoreList();
            });

            document.getElementById('mobileToggle').addEventListener('click', () => {
                document.getElementById('sidebar').classList.toggle('open');
            });

            document.getElementById('map').addEventListener('click', () => {
                if (window.innerWidth <= 820) {
                    document.getElementById('sidebar').classList.remove('open');
                }
            });
        }

        window.copyAddress = function(id) {
            const store = stores.find(s => s.id === id);
            if (!store) return;
            const text = `${store.name}\n${store.address}, ${store.city}`;
            navigator.clipboard.writeText(text).then(() => {
                toast('Alamat disalin');
            }).catch(() => {
                toast('Gagal menyalin');
            });
        };

        function toast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(el._timer);
            el._timer = setTimeout(() => el.classList.remove('show'), 2000);
        }
    </script>
</body>
</html>
